<head>
  <meta charset="UTF-8" />

  <title>Quarterly Theory Calendar</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
    }
    .calendar-nav {
      text-align: center;
      margin: 1rem 0;
    }
    .calendar-nav button {
      padding: 0.5rem 0.75rem;
      margin: 0 0.25rem;
      font-size: 1rem;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #ccc;
    }
    .day-name {
      background: #0077cc;
      color: white;
      padding: 0.4rem;
      font-size: 0.8rem;
      text-align: center;
      font-weight: bold;
    }
    .day-cell {
      background: white;
      min-height: 100px;
      padding: 0.4rem;
      font-size: 12px;
      border: 1px solid #ddd;
      position: relative;
      word-wrap: break-word;
    }
    .date-number {
      font-weight: bold;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
    }
    .event {
      background: #e0f0ff;
      margin: 0.15rem 0;
      padding: 0.25rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .empty {
      background: #f9f9f9;
    }

    @media (max-width: 768px) {
      .calendar-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .day-name {
        display: none;
      }
      .calendar-nav button {
        width: 45%;
        margin: 0.25rem 2%;
      }
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      padding: 2rem;
    }

      text-align: center;

      background: #0077cc;

      text-align: center;

    }
    .day-cell {
      background: white;
      min-height: 120px;
      padding: 0.5rem;
      vertical-align: top;
      font-size: 14px;
      border: 1px solid #ddd;
      position: relative;
    }
    .date-number {
      font-weight: bold;
      margin-bottom: 0.25rem;
    }
    .event {
      background: #e0f0ff;
      margin: 0.2rem 0;
      padding: 0.3rem;
      border-radius: 4px;
      font-size: 12px;
    }
    .empty {
      background: #f9f9f9;
    }
  </style>
</head>

let currentMonth = 3;
let currentYear = 2024;

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear += 1;
  } else if (currentMonth < 0) {
    currentMonth = 11;
    currentYear -= 1;
  }
  renderCalendar(currentMonth, currentYear);
}

function renderCalendar(monthIndex, year) {
  const calendar = document.getElementById('calendar');
  const calendarTitle = document.getElementById('calendar-title');
  calendar.innerHTML = '';

  const firstDay = new Date(year, monthIndex, 1);
  const monthName = firstDay.toLocaleString('default', { month: 'long' });
  const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
  calendarTitle.textContent = `Quarterly Theory Calendar – ${monthName} ${year}`;

  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  dayNames.forEach(day => {
    const div = document.createElement('div');
    div.className = 'day-name';
    div.textContent = day;
    calendar.appendChild(div);
  });

  for (let i = 0; i < firstDay.getDay(); i++) {
    const div = document.createElement('div');
    div.className = 'day-cell empty';
    calendar.appendChild(div);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const div = document.createElement('div');
    div.className = 'day-cell';

    const dateLabel = document.createElement('div');
    dateLabel.className = 'date-number';
    dateLabel.textContent = day;
    div.appendChild(dateLabel);

    if (eventData[dateStr]) {
      eventData[dateStr].forEach(event => {
        const e = document.createElement('div');
        e.className = 'event';
        e.textContent = `${event.time} — ${event.label}`;
        div.appendChild(e);
      });
    }

    calendar.appendChild(div);
  }
}

renderCalendar(currentMonth, currentYear);
